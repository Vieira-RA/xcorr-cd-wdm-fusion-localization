# ---------------------------------------------------------------------------
# CRB study - middle-ground configuration
#   channels {4,8,12}, 5 fibres, 30x30 grids, 50 realisations
# ---------------------------------------------------------------------------
run:
  name: "crb_mid"

fibre:
  L_km: 0.5              # modeled local disturbed section length
  L_F: 20.0
  D_pmd: 2.5298e-15
  lambda0_nm: 1550
  seed: 0

transient:
  A_pulse: 0.0031

time:
  fs_factor: 20
  t_end_factor: 160

wdm:
  generation: full_grid
  full_grid_spacing_Hz: 50e9
  f_min_Hz: 184e12
  f_max_Hz: 196e12

event:
  distance_km: 500.0     # section centre distance from the receiver

sweep:
  bandwidths:
    start_Hz: 100.0
    stop_Hz: 2.0e6
    num: 30
  snrs_dB:
    # Mean per-component energy / per-component noise variance (E/N0).
    start: 27.7815125038
    stop: 127.7815125038
    num: 30
  n_realisations: 50
  n_fibres: 5

noise:
  snr_definition: "mean_per_component_energy_over_noise_variance"
  base_seed: 0

filter:
  mode: "none"
  order: 4
  low_factor: 0.5
  high_factor: 3.0

analysis:
  channel_counts: [4, 8, 12]
  channel_selection: alternating

output:
  jones_dir: "jones_data_crb_mid"
  run_dir: "results_crb_mid"
  save_pairs: "all"
