# ---------------------------------------------------------------------------
# CRB study - equispaced grid, GCC-PHAT estimator (compare with parabolic)
#   * reuses jones_data_crb_equispaced (no regeneration)
#   * identical grids/selection to sweep_config_crb_equispaced.yaml
# ---------------------------------------------------------------------------
run:
  name: "crb_equispaced_gcc"
  n_jobs: -1

fibre:
  L_km: 0.5              # modeled local disturbed section length
  L_F: 20.0
  D_pmd: 2.5298e-15
  lambda0_nm: 1550
  seed: 0

transient:
  A_pulse: 0.0031

time:
  fs_factor: 20
  t_end_factor: 160

wdm:
  generation: custom
  n_channels: 30
  channel_grid: uniform
  f_min_Hz: 184e12
  f_max_Hz: 196e12

event:
  distance_km: 500.0     # section centre distance from the receiver

sweep:
  bandwidths:
    start_Hz: 200.0
    stop_Hz: 2.0e6
    num: 50
  snrs_dB:
    # Mean per-component energy / per-component noise variance (E/N0).
    start: 42.7815125038
    stop: 127.7815125038
    num: 50
  n_realisations: 100
  n_fibres: 10

noise:
  snr_definition: "mean_per_component_energy_over_noise_variance"
  base_seed: 0

# GCC-PHAT settings (also the estimator switch lives under analysis)
phat:
  fmax_factor: 2.0
  mag_threshold: 0.05

filter:
  mode: "none"
  order: 4
  low_factor: 0.5
  high_factor: 3.0

analysis:
  channel_counts: [5, 10, 15]
  channel_selection: uniform
  estimator: "gcc_phat"       # <-- parabolic | gcc_phat

output:
  jones_dir: "jones_data_crb_equispaced"
  run_dir: "results_crb_equispaced_gcc"
  save_pairs: "all"
